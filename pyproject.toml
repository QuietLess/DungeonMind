[project]
name = "dungeonmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tolga Değirmenci", email = "tolgadegirmenci4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langgraph>=1.2.15",
    "onnxruntime>=1.23,<1.24 ; platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "pyyaml>=6.0",
    "qdrant-client[fastembed]>=1.12",
    "rank-bm25>=0.2.2",
    "typer>=0.27.3",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "nodejs-wheel>=24.10",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[project.scripts]
dungeonmind = "dungeonmind.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # "a b c".split() is clearer than a long list literal

[tool.pytest.ini_options]
testpaths = ["tests"]
