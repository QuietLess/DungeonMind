[project]
name = "dungeonmind"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tolga Değirmenci", email = "tolgadegirmenci4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "qdrant-client[fastembed]>=1.12",
    "rank-bm25>=0.2.2",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[project.scripts]
dungeonmind = "dungeonmind.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
